plugins {
  id 'eclipse'
  id 'java-library'
  id 'maven-publish'
  id 'idea'
  id "es.degrassi.unified-publishing-with-mmr-bot" version "1.3.1"
  id 'net.neoforged.moddev' version '2.0.105'
}

tasks.named('wrapper', Wrapper).configure {
  distributionType = Wrapper.DistributionType.BIN
}

base {
  group = maven_group
  version = mod_version
  archivesName = project.archives_base_name
}

java {
  toolchain.languageVersion = JavaLanguageVersion.of(21)
  withSourcesJar()
}

tasks.processResources {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

neoForge {
  version = project.neo_version

  parchment {
    mappingsVersion = project.parchment_mappings_version
    minecraftVersion = project.parchment_minecraft_version
  }

  accessTransformers.from project.file("src/main/resources/META-INF/accesstransformer.cfg")

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
  runs {
    // applies to all the run configs below
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      logLevel = org.slf4j.event.Level.DEBUG
    }
    client {
      client()
      systemProperty "neoforge.enabledGameTestNamespaces", project.modid
    }
    server {
      server()
      programArgument "--nogui"
      systemProperty "neoforge.enabledGameTestNamespaces", project.modid
    }
    gameTestServer {
      type = "gameTestServer"
      systemProperty "neoforge.enabledGameTestNamespaces", project.modid
    }
    data {
      data()
      programArguments.addAll '--mod', project.modid, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
  }
  mods {
    "${modid}" {
      sourceSet(sourceSets.main)
    }
  }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
  runtimeClasspath.extendsFrom localRuntime
  libraries
  implementation.extendsFrom libraries
}

repositories {
  mavenCentral()
  maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
  maven {
    name = "Custom Machinery maven"
    url = "https://maven.frinn.fr/releases"
    content {
      includeGroup "frinn.custommachinery"
    }
  }
  maven {
    name = "Mod maven"
    url = "https://modmaven.dev/"
    content {
      includeGroup "mcjty.theoneprobe"
      includeGroup "mekanism"
    }
  }
  maven {
    name = "Shedaniel maven"
    url = "https://maven.architectury.dev/"
    content {
      includeGroup "me.shedaniel.cloth"
    }
  }
  maven {
    name = "Lat's maven"
    url = "https://maven.latvian.dev/releases"
    content {
      includeGroup "dev.latvian.mods"
      includeGroup "dev.latvian.apps"
    }
  }
  maven {
    // location of the maven that hosts JEI files
    name = "Progwml6 maven"
    url = "https://dvs1.progwml6.com/files/maven/"
    content {
      includeGroup "mezz.jei"
    }
  }
  maven {
    name = 'BlameJared Maven'
    url = 'https://maven.blamejared.com'
    content {
      includeGroup "com.blamejared.crafttweaker"
      includeGroup "org.openzen.zencode"
      includeGroup "mezz.jei"
      includeGroup "com.hollingsworth.ars_nouveau"
      includeGroup "com.hollingsworth.nuggets"
      includeGroup "vazkii.patchouli"
    }
  }
  maven {
    name = "Illusive Soulworks maven"
    url = "https://maven.theillusivec4.top/"
  }
  //Needed for KubeJS
  maven {
    name = "Jitpack Maven"
    url = "https://jitpack.io"
    content {
      includeGroup "com.github.rtyley"
    }
  }
  maven {
    name = 'Forge'
    url = "https://maven.minecraftforge.net"
  }
  maven {
    name = "OctoStudios"
    url = uri("https://maven.octo-studios.com/releases")
  }
  maven {
    name = 'GeckoLib'
    url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    content {
      includeGroup("software.bernie.geckolib")
    }
  }
  maven {
    url "https://www.cursemaven.com"
    content {
      includeGroup "curse.maven"
    }
  }
  mavenLocal()
}

dependencies {
  // Specify the version of Minecraft to use.
  // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
  // The "userdev" classifier will be requested and setup by ForgeGradle.
  // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
  // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
  implementation "net.neoforged:neoforge:${project.neo_version}"
  implementation ("io.github.llamalad7:mixinextras-neoforge:0.4.1")
  // ars
  localRuntime ("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
  localRuntime compileOnly ("com.hollingsworth.nuggets:nuggets-neoforge-1.21:${project.nuggets_version}")
  localRuntime ("vazkii.patchouli:Patchouli:1.21.1-${project.patchouli_version}")
  localRuntime "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
  localRuntime compileOnly ("com.hollingsworth.ars_nouveau:ars_nouveau-${project.minecraft_version}:${project.ars_version}.1298")

  // JEI 10
  compileOnly ("mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}")
  localRuntime ("mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}")

  // Custom Machinery
  localRuntime compileOnly ("frinn.custommachinery:CustomMachinery-neoforge:${project.minecraft_version}-${project.custommachinery_version}")

  //KubeJS
  localRuntime compileOnly ("dev.latvian.mods:kubejs-neoforge:${project.kubejs_version}")

  //Crafttweaker
  localRuntime compileOnly ("com.blamejared.crafttweaker:CraftTweaker-neoforge-${project.minecraft_version}:${project.ct_version}")

  // Jade
  localRuntime compileOnly("curse.maven:jade-324717:${jade_version}")

  // The one probe
  localRuntime compileOnly("mcjty.theoneprobe:theoneprobe:${top_version}") {transitive = false}

  // Mekanism
  localRuntime("mekanism:Mekanism:${mekanism_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
  var replaceProperties = [
      "modid": modid,
      "mod_version": mod_version,
      "mod_name": mod_name,
      "mod_description": mod_description,
      "author": author,
      "issues": issues,
      "license": license,
      "icon": icon,
      "minecraft_version": minecraft_version,
      "custommachinery_version": custommachinery_version,
      "ars_version": ars_version,
      "neo_version": neo_version
  ]
  inputs.properties replaceProperties
  expand replaceProperties
  from "src/main/templates"
  into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
  options.release = 21
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}

unifiedPublishingWithMMRBot {
  project {
    displayName = "Custom-Machinery-ArsNouveau-${project.minecraft_version}-${project.mod_version}"
    releaseType = "release"
    if(rootProject.file("CHANGELOG.md").exists()) {
      changelog = rootProject.file("CHANGELOG.md").text
    }
    gameVersions = ["${minecraft_version}", "1.21"]
    gameLoaders = ["neoforge"]
    mainPublication jar
    modid = "custom_machinery_ars"
    modVersion = "Custom-Machinery-ArsNouveau-${project.minecraft_version}-${project.mod_version}"

    var CURSE_API_KEY = System.getenv("CURSEFORGE")
    if (CURSE_API_KEY != null) {
      curseforge {
        token = CURSE_API_KEY
        id = "969074"
        relations {
          depends "custom-machinery"
          depends "ars-nouveau"
          optional "crafttweaker"
          optional "kubejs"
        }
      }
    }
  }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
  publications {
    register('mavenJava', MavenPublication) {
      groupId = maven_group
      artifactId = archivesBaseName
      version = project.version
      from components.java

      pom {
        name = mod_name
        description = mod_description
        packaging = 'jar'
        scm {
          url = mod_github
        }
        issueManagement {
          system = 'github'
          url = mod_issues
        }
        licenses {
          license {
            name = mod_license
            distribution = 'repo'
          }
        }
        developers {
          developer {
            id = mod_authors
            name = mod_authors
            roles = ['developper']
          }
        }
      }
    }
  }
  repositories {
    maven {
      name = 'maven'
      url = 'https://maven.degrassi.es/releases'
      credentials {
        username = "Alec_016GG"
        password = System.getenv("MAVEN_PASSWORD")
      }
    }
  }
}

// Prevent Mixin annotation processor from getting into IDEA's annotation processor settings
// Copied from Botania
if (System.getProperty("idea.sync.active") == "true") {
  afterEvaluate {
    tasks.withType(JavaCompile).all {
      it.options.annotationProcessorPath = files()
    }
  }
}
